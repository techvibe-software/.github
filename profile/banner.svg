<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)" />
      <stop offset="50%" stop-color="rgba(129, 140, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.3)" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="topGlow" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.18)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </radialGradient>

    <radialGradient id="rightGlow" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.16)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0)" />
    </radialGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: 6px;
      fill: #ffffff;
    }
    .brand-tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 5px;
      text-transform: uppercase;
      fill: url(#glowGrad);
    }
    .brand-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      fill: #38bdf8;
      font-weight: 500;
      letter-spacing: 1px;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="url(#dotGrid)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="320" rx="16" fill="url(#topGlow)" />
  <rect width="1200" height="320" rx="16" fill="url(#rightGlow)" />

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Geometric Tech Emblem (Left side) -->
  <g transform="translate(90, 85)">
    <!-- Outer hexagon glow -->
    <polygon points="75,0 150,43 150,130 75,173 0,130 0,43" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" opacity="0.85" />
    <!-- Inner lines -->
    <line x1="75" y1="0" x2="75" y2="173" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />
    <line x1="0" y1="43" x2="150" y2="130" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
    <line x1="150" y1="43" x2="0" y2="130" stroke="#c084fc" stroke-width="1.5" opacity="0.4" />
    
    <!-- Central core diamond -->
    <polygon points="75,55 105,86 75,118 45,86" fill="url(#glowGrad)" opacity="0.9" />
    <!-- Orbiting nodes -->
    <circle cx="75" cy="0" r="4" fill="#38bdf8" />
    <circle cx="150" cy="43" r="4" fill="#818cf8" />
    <circle cx="150" cy="130" r="4" fill="#c084fc" />
    <circle cx="75" cy="173" r="4" fill="#38bdf8" />
    <circle cx="0" cy="130" r="4" fill="#818cf8" />
    <circle cx="0" cy="43" r="4" fill="#c084fc" />
  </g>

  <!-- Text Hierarchy (Right side) -->
  <g transform="translate(290, 85)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="150" height="24" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#10b981" />
      <text x="24" y="16" class="badge-text">TECHVIBE STUDIO</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" class="brand-title">TECHVIBE</text>

    <!-- Tagline -->
    <text x="2" y="105" class="brand-tagline">INNOVATE · CREATE · DOMINATE</text>

    <!-- Description -->
    <text x="2" y="145" class="brand-desc">Building Modern Web Applications, AI-Driven Solutions &amp; Open-Source Tooling</text>

    <!-- Bottom Line Accent -->
    <rect x="2" y="170" width="120" height="3" rx="1.5" fill="url(#glowGrad)" />
  </g>
</svg>
